services:
  db:
    image: pgvector/pgvector:pg16
    container_name: skyassist-db
    environment:
      POSTGRES_USER: skyassist
      POSTGRES_PASSWORD: skyassist
      POSTGRES_DB: skyassist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyassist -d skyassist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: